name = "snek-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

routes = [
  { pattern = "mccarrison.me/snek", zone_name = "mccarrison.me" },
  { pattern = "mccarrison.me/snek/*", zone_name = "mccarrison.me" },
]

[vars]
PATH_PREFIX = "/snek"
DEBUG_LOG = "1"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Leaderboard"]
